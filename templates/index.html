<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jady - Quebre o Ciclo</title>
    <link rel="canonical" href="sua_url_aqui"> 
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    
    <div id="panic-button" title="Sair Imediatamente (Emergência)">
        <i class="fas fa-exclamation-triangle"></i>
    </div>
    
    <div id="dark-mode-toggle" title="Modo Escuro">
        <i class="fas fa-moon"></i>
    </div>
    
    <div id="hide-history-toggle" class="floating-button" title="Ocultar Histórico Rápido">
        <i class="fas fa-eye-slash"></i>
    </div>

    <div id="chat-container">
        
        <div id="messages-area">
            <div id="reset-button" title="Nova Conversa">
                <i class="fas fa-redo"></i>
            </div>
            </div>

    </div>
    
    <div id="footer-fixed-container">
        <div id="input-area">
            
            <div id="mic-wrapper" title="Falar (Reconhecimento de Voz)">
                <i class="fas fa-microphone"></i>
            </div>
            
            <input type="text" id="user-input" placeholder="Fale com a Jady..." autocomplete="off">
            
            <div id="send-button" title="Enviar Mensagem">
                <i class="fas fa-paper-plane"></i>
            </div>
            
        </div>
        
        <div id="disclaimer-bottom">
            A Jady é uma assistente virtual. Em caso de emergência, ligue 190.
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
