<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin Jady</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { color: #ff69b4; }
        a.logout { color: #ff69b4; text-decoration: none; padding: 8px 15px; border: 1px solid #ff69b4; border-radius: 4px; }
        a.logout:hover { background-color: #ff69b4; color: white; }
        textarea { width: 100%; height: 300px; padding: 10px; border: 1px solid #ccc; box-sizing: border-box; resize: vertical;}
        button[type="submit"] { background-color: #ff69b4; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        .message-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; padding: 10px; border-radius: 4px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Painel de Administração da Jady</h1>
        <a href="{{ url_for('admin_logout') }}" class="logout">Sair</a>
    </div>
    
    {% if message %}
        <div class="message-success">{{ message }}</div>
    {% endif %}

    <h2>Instruções do Sistema (Conhecimento Central)</h2>
    
    <p>Edite o texto abaixo para mudar a personalidade e as diretrizes de resposta da Jady. (Use Markdown para formatação).</p>
    
    <form method="POST">
        <textarea name="system_instruction_text">{{ current_instruction }}</textarea>
        <button type="submit">Salvar e Aplicar Novo Conhecimento</button>
    </form>
</body>
</html>
