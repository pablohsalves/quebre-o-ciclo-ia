<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin Jady</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { color: #ff69b4; }
        a.logout { color: #ff69b4; text-decoration: none; padding: 8px 15px; border: 1px solid #ff69b4; border-radius: 4px; }
        a.logout:hover { background-color: #ff69b4; color: white; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Painel de Administração da Jady</h1>
        <a href="{{ url_for('admin_logout') }}" class="logout">Sair</a>
    </div>

    <h2>Instruções do Sistema (Conhecimento Central)</h2>
    
    <p>Aqui, futuramente, você poderá editar as diretrizes centrais da Jady, que definem sua personalidade e foco (atualmente definidas na variável `SYSTEM_INSTRUCTION` no app.py).</p>
    
    <form>
        <textarea style="width: 100%; height: 300px; padding: 10px; border: 1px solid #ccc;"></textarea>
        <button type="submit" style="background-color: #ff69b4; color: white; padding: 10px 15px; border: none; border-radius: 4px; margin-top: 10px;">Salvar Conhecimento</button>
    </form>
</body>
</html>
